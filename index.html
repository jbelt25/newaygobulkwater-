<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newaygo Bulk Water Company - Pre-Sale</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f8f9fa; 
            color: #333; 
        }
        .header { 
            background-color: #0056b3; 
            color: white; 
            text-align: center; 
            padding: 2.5rem 1rem; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 2.5rem; 
            letter-spacing: 1px;
        }
        .header h2 { 
            margin: 10px 0; 
            font-size: 1.25rem; 
            font-weight: 400; 
        }
        .header p { 
            font-size: 0.9rem; 
            letter-spacing: 1.5px; 
            margin-top: 15px;
        }
        .hero-section {
            position: relative;
            text-align: center;
            background-color: #dee2e6;
            min-height: 250px;
        }
        .hero-image { 
            width: 100%; 
            max-width: 800px; 
            height: auto; 
            display: block; 
            margin: 0 auto;
        }
        .hero-edit-controls {
            display: none;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 16px;
            border-radius: 8px;
            gap: 10px;
            align-items: center;
            z-index: 100;
        }
        .hero-edit-controls button {
            background: #ffc107;
            border: none;
            padding: 8px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            color: #000;
        }
        .hero-edit-controls button:hover {
            background: #e0a800;
        }
        .container { 
            max-width: 1000px; 
            margin: 2rem auto; 
            padding: 0 1rem; 
        }
        .grid-features { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 1.5rem; 
            text-align: center; 
            margin: 2rem 0; 
        }
        .feature-card { 
            background: white; 
            padding: 1.5rem; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            border-top: 4px solid #0056b3;
        }
        .feature-card img { 
            max-width: 60px; 
            margin-bottom: 1rem; 
        }
        .feature-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }
        .feature-card p {
            margin: 0;
            color: #555;
        }
        .pricing-section { 
            margin: 3rem 0;
        }
        .pricing-section h2 { 
            text-align: center; 
            color: #0056b3; 
            text-transform: uppercase; 
        }
        .pricing-table { 
            width: 100%; 
            border-collapse: collapse; 
            background: white; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        .pricing-table th, .pricing-table td { 
            padding: 1.25rem; 
            text-align: center; 
            border-bottom: 1px solid #ddd; 
        }
        .pricing-table th { 
            background-color: #0056b3; 
            color: white; 
            text-transform: uppercase; 
        }
        .pricing-table tr:hover { 
            background-color: #f1f1f1; 
        }
        .guarantee { 
            background-color: #e9ecef; 
            padding: 2rem; 
            text-align: center; 
            border-radius: 8px; 
            border: 2px dashed #0056b3; 
            margin-top: 2rem; 
        }
        .guarantee h2 {
            margin-top: 0;
            color: #d9534f;
        }
        .footer { 
            text-align: center; 
            padding: 2rem; 
            font-size: 0.95rem; 
            font-weight: bold;
            color: #444; 
        }

        /* Fixed Toolbar Container */
        .admin-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #002d62;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.35);
            z-index: 100000;
            user-select: none;
        }
        .admin-bar.hidden {
            display: none !important;
        }
        .admin-bar span {
            font-size: 0.85rem;
            font-weight: bold;
            margin-right: 2px;
        }
        .admin-bar button {
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn-toggle-edit { 
            background: #28a745 !important; 
        }
        .btn-toggle-edit.active { 
            background: #dc3545 !important; 
        }
        .btn-reset { 
            background: #6c757d !important; 
        }
        .btn-hide { 
            background: #17a2b8 !important; 
        }

        /* Secret restore trigger in bottom right corner */
        .restore-trigger {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 40px;
            height: 40px;
            background: rgba(0, 86, 179, 0.1);
            z-index: 99999;
            cursor: pointer;
            border-radius: 8px 0 0 0;
        }
        .restore-trigger:hover {
            background: rgba(0, 86, 179, 0.45);
        }

        /* Visual cue for editable items when edit mode is active */
        body.edit-mode .editable {
            outline: 2px dashed #007bff !important;
            background-color: rgba(0, 123, 255, 0.08) !important;
            cursor: text !important;
        }
        body.edit-mode .hero-edit-controls {
            display: flex !important;
        }
    </style>
</head>
<body>

    <!-- Discrete restore hotspot (Click to restore hidden toolbar) -->
    <div class="restore-trigger" id="restoreTrigger" title="Click or Press Ctrl+Shift+E to restore toolbar" onclick="unhideToolbarUI()"></div>

    <!-- Floating Live Editor Controls -->
    <div class="admin-bar" id="adminBar">
        <span id="editorStatus">Viewing</span>
        <button id="toggleEditBtn" class="btn-toggle-edit" type="button" onclick="toggleEditModeUI()">Enable Editing</button>
        <button id="resetDefaultsBtn" class="btn-reset" type="button" onclick="resetDefaultsUI()">Reset</button>
        <button id="hideToolbarBtn" class="btn-hide" type="button" onclick="hideToolbarUI()" title="Shortcut: Ctrl+Shift+E">Hide Controls</button>
    </div>

    <!-- Header -->
    <header class="header">
        <h1 class="editable" data-key="header_h1">NEWAYGO BULK WATER COMPANY</h1>
        <h2 class="editable" data-key="header_h2">SECURE HIGH-VOLUME ACCESS: WHITE CLOUD BULK FILL STATION</h2>
        <p class="editable" data-key="header_sub">EXCLUSIVE PRE-LAUNCH RATES | EGLE APPROVED | PROFESSIONAL GRADE</p>
    </header>

    <!-- Hero Image Area -->
    <section class="hero-section">
        <img id="heroImg" src="bulk_water_pre-sale_flyer-tanker.png" alt="Tanker truck filling at 300+ GPM flow rate station" class="hero-image">
        
        <div class="hero-edit-controls" id="heroControls">
            <input type="file" id="heroFileInput" accept="image/*" style="display:none;" onchange="handleHeroFileUpload(event)">
            <button type="button" onclick="document.getElementById('heroFileInput').click()">Upload File</button>
            <button type="button" onclick="promptHeroUrlInput()">Image URL</button>
        </div>
    </section>

    <main class="container">
        
        <!-- Value Propositions Grid -->
        <section class="grid-features">
            <div class="feature-card">
                <h3 class="editable" data-key="feat1_h3">Stop Waiting. Start Hauling.</h3>
                <p class="editable" data-key="feat1_p1"><strong>Flow Rate:</strong> 300+ GPM</p>
                <p class="editable" data-key="feat1_p2" style="margin-top: 10px;"><strong>Priority "Fast-Pass" Access:
